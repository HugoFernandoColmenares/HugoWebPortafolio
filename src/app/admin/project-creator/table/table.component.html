<app-data-table
  [rows]="projects()"
  [columns]="columns()"
  [filters]="filters()"
  [actions]="rowActions()"
  [loading]="loading()"
  [title]="labels().title"
  [subtitle]="labels().subtitle"
  [emptyLabel]="labels().empty"
  [loadingLabel]="ts.t().data_table_loading"
  [actionsLabel]="labels().columnActions"
  [pageSizeLabel]="ts.t().data_table_rows"
  [prevLabel]="ts.t().data_table_prev"
  [nextLabel]="ts.t().data_table_next"
  [pageLabel]="ts.t().data_table_page"
  (action)="onAction($event)"
>
  @if (canManage()) {
    <button dataTableActions type="button" class="btn-primary" (click)="addProject.emit()">
      {{ labels().add }}
    </button>
  }
</app-data-table>
