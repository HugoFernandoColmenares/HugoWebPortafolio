<button type="button" class="skip-link" (click)="skipToContent()">{{ ts.t().skip_to_content }}</button>
<app-header #header [menuOpen]="menuOpen()" (toggleMenu)="setMenu(!menuOpen())" />
<app-sidebar [isOpen]="menuOpen()" (dismiss)="setMenu(false)" />
<main id="main-content" class="main-content" tabindex="-1" [attr.inert]="menuOpen() ? '' : null">
  <router-outlet />
</main>
<app-footer [attr.inert]="menuOpen() ? '' : null" />
