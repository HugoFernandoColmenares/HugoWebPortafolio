<section
  class="project-carousel"
  [attr.aria-labelledby]="titleId"
  (mouseenter)="setPaused(true)"
  (mouseleave)="setPaused(false)"
>
  <div class="project-carousel__header">
    <h2 class="project-carousel__title" [id]="titleId">{{ title() }}</h2>
  </div>

  <div class="project-carousel__viewport">
    <div class="project-carousel__hit">
      <button
        type="button"
        class="icon-btn project-carousel__btn"
        (click)="scroll(-1)"
        [attr.aria-label]="ts.t().carousel_prev"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
    </div>

    <div
      class="project-carousel__window"
      tabindex="0"
      role="region"
      [attr.aria-label]="ts.t().carousel_track"
      (keydown)="onTrackKeydown($event)"
    >
      <div class="project-carousel__track" #track>
        @for (project of projects(); track project.id) {
          <div class="project-carousel__slide">
            <app-project-card [project]="project" />
          </div>
        }
        @for (project of projects(); track 'loop-' + project.id) {
          <div class="project-carousel__slide" aria-hidden="true">
            <app-project-card [project]="project" />
          </div>
        }
      </div>
    </div>

    <div class="project-carousel__hit">
      <button
        type="button"
        class="icon-btn project-carousel__btn"
        (click)="scroll(1)"
        [attr.aria-label]="ts.t().carousel_next"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>
  </div>
</section>
