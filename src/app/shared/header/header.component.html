<header class="header">
  <div class="header__inner container">
    <a routerLink="/home" class="brand" [attr.aria-label]="'Hugo Colmenares — ' + ts.t().nav_home">
      <span class="brand__mark" aria-hidden="true">hc</span>
      <span class="brand__name">Hugo Colmenares</span>
    </a>

    <nav class="header__nav" [attr.aria-label]="ts.t().nav_main">
      <a class="header__link" routerLink="/home" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ ts.t().nav_home }}</a>
      <a class="header__link" routerLink="/projects" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ ts.t().nav_projects }}</a>
      <a class="header__link" routerLink="/about" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ ts.t().nav_about }}</a>
      <a class="header__link header__link--cta" routerLink="/contact" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ ts.t().nav_contact }}</a>
    </nav>

    <div class="header__actions">
      <app-language-toggle />

      <button
        type="button"
        class="icon-btn"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.currentTheme() === 'dark' ? ts.t().theme_to_light : ts.t().theme_to_dark"
      >
        <app-icon [name]="themeService.currentTheme() === 'dark' ? 'sun' : 'moon'" />
      </button>

      <button
        #menuButton
        type="button"
        class="icon-btn header__menu-btn"
        (click)="toggleMenu.emit()"
        [attr.aria-label]="ts.t().nav_open"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="dialog"
        aria-controls="mobile-nav"
      >
        <app-icon name="menu" />
      </button>
    </div>
  </div>
</header>
