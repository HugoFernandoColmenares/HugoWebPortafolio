@if (isOpen()) {
  <div class="sidebar-backdrop" (click)="dismiss.emit()" aria-hidden="true"></div>

  <div
    id="mobile-nav"
    class="sidebar"
    role="dialog"
    aria-modal="true"
    aria-labelledby="mobile-nav-title"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <div class="sidebar__header">
      <p id="mobile-nav-title" class="sidebar__title"><span class="prompt">~/</span>{{ ts.t().nav_menu_title }}</p>
      <button type="button" class="icon-btn" (click)="dismiss.emit()" [attr.aria-label]="ts.t().nav_close" cdkFocusInitial>
        <app-icon name="close" />
      </button>
    </div>

    <nav class="sidebar__nav" [attr.aria-label]="ts.t().nav_mobile">
      <a class="sidebar__link" routerLink="/home" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="dismiss.emit()">
        <span class="sidebar__num" aria-hidden="true">01</span>{{ ts.t().nav_home }}
      </a>
      <a class="sidebar__link" routerLink="/projects" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="dismiss.emit()">
        <span class="sidebar__num" aria-hidden="true">02</span>{{ ts.t().nav_projects }}
      </a>
      <a class="sidebar__link" routerLink="/about" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="dismiss.emit()">
        <span class="sidebar__num" aria-hidden="true">03</span>{{ ts.t().nav_about }}
      </a>
      <a class="sidebar__link" routerLink="/contact" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="dismiss.emit()">
        <span class="sidebar__num" aria-hidden="true">04</span>{{ ts.t().nav_contact }}
      </a>
    </nav>

    <div class="sidebar__footer">
      <a class="btn-primary sidebar__cta" routerLink="/contact" (click)="dismiss.emit()">{{ ts.t().nav_cta }}</a>
      <a class="sidebar__mail" [href]="'mailto:' + site.email">{{ site.email }}</a>
      <div class="sidebar__social">
        <a class="icon-btn" [href]="site.githubUrl" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><app-icon name="github" /></a>
        <a class="icon-btn" [href]="site.linkedinUrl" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><app-icon name="linkedin" /></a>
        <a class="icon-btn" [href]="site.deviantArtUrl" target="_blank" rel="noopener noreferrer" aria-label="DeviantArt"><app-icon name="deviantart" /></a>
      </div>
    </div>
  </div>
}
